server {
  listen 4000;
  server_name _;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/auth/ {
    proxy_pass http://api-teams:4000;
  }

  location /api/users/ {
    proxy_pass http://api-teams:4000;
  }

  location /api/settings/ {
    proxy_pass http://api-teams:4000;
  }

  location /api/dashboard/ {
    proxy_pass http://api-dashboard:4000;
  }

  location /api/notifications/ {
    proxy_pass http://api-dashboard:4000;
  }

  location /api/projects/ {
    proxy_pass http://api-projects:4000;
  }

  location /api/portfolio/ {
    proxy_pass http://api-projects:4000;
  }

  location /api/reports/ {
    proxy_pass http://api-projects:4000;
  }

  location /api/backlog/ {
    proxy_pass http://api-scrum-board:4000;
  }

  location /api/sprints/ {
    proxy_pass http://api-scrum-board:4000;
  }

  location /api/boards/ {
    proxy_pass http://api-scrum-board:4000;
  }

  location /socket.io/ {
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_pass http://api-scrum-board:4000;
  }

  location /api/qa/ {
    proxy_pass http://api-qa:4000;
  }

  location /api/github/ {
    proxy_pass http://api-github:4000;
  }

  location /api/docs {
    proxy_pass http://api-dashboard:4000;
  }

  location /health {
    return 200 "devhub-api-gateway ok\n";
  }
}
